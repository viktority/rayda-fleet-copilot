[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rayda-fleet-copilot"
version = "0.1.0"
description = "Evidence-grounded, tenant-scoped fleet agent with human-approved simulated actions"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic>=2.12,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[project.scripts]
fleet = "fleet_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
